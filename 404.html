/* /FACE */
function zero(x,y,w,h,r){const p=[];for(let a=-1.9;a<4.85;a+=.12){const k=1-(a+1.9)*.012;p.push([x+w/2+Math.cos(a)*w*.45*k,y+h/2+Math.sin(a)*h*.5*k])}return[densify(p,9,r)]}
function four04(x,y,h,r){const w=h*.62,g=h*.14,zw=FACE.ra*h,cx=x+w+g+zw/2,cy=y+h/2;
  const o=densify(FACE.zero.map(([u,v])=>[cx+u*h/2,cy+v*h/2]),9,r);
  return[...four(x,y,w,h,r),o,...four(x+w+2*g+zw,y,w,h,r)].map(pts=>({pts,w:LW,fixed:true,seed:r()*99,hdr:1}))}
/* closed rounded rectangle, starting bottom middle, running right then up the right side */
function rr(x0,y0,x1,y1,r,step){step=step||10;const p=[],mx=(x0+x1)/2;
  const line=(ax,ay,bx,by)=>{const n=Math.max(1,Math.round(Math.hypot(bx-ax,by-ay)/step));for(let i=0;i<n;i++)p.push([ax+(bx-ax)*i/n,ay+(by-ay)*i/n])};
  const arc=(cx,cy,a0)=>{const n=Math.max(2,Math.round(r*1.57/step));for(let i=0;i<n;i++){const a=a0-i/n*Math.PI/2;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}};
  line(mx,y1,x1-r,y1);arc(x1-r,y1-r,Math.PI/2);line(x1,y1-r,x1,y0+r);arc(x1-r,y0+r,0);line(x1-r,y0,x0+r,y0);arc(x0+r,y0+r,-Math.PI/2);
  line(x0,y0+r,x0,y1-r);arc(x0+r,y1-r,-Math.PI);line(x0+r,y1,mx,y1);p.push([mx,y1]);return p}
/* One clock for everything that moves. Each frame it runs whatever is animating, then paints the canvas once if anything
   asked for it (st.draw() only asks). Separate loops used to paint up to five times in one frame. */
const LOOP={fns:new Set(),dirty:false,on:false};
const wake=()=>{if(!LOOP.on){LOOP.on=true;requestAnimationFrame(frame)}};
function frame(now){LOOP.on=false;for(const f of[...LOOP.fns])f(now);if(LOOP.dirty){LOOP.dirty=false;st.render()}if(LOOP.fns.size||LOOP.dirty)wake()}
const every=fn=>{LOOP.fns.add(fn);wake();return()=>LOOP.fns.delete(fn)};
function tween(ms,fn){if(reduce){fn(1);return}const t0=performance.now();const off=every(n=>{const t=Math.min(1,Math.max(0,(n-t0)/ms));fn(t);if(t>=1)off()})}
function play(st,list,speed,done){if(reduce){st.draw();done&&done();return}
  list.forEach(s=>s.n=0);let i=0;const off=every(()=>{const s=list[i];if(!s){off();st.draw();done&&done();return}
    s.n+=speed;if(s.n>=s.pts.length){delete s.n;i++}st.draw()})}
function playAll(st,list,speed,done){if(reduce||!list.length){st.draw();done&&done();return}
